[package]
name = "oresat-at86rf215-driver"
version = "0.4.6"
edition = "2024"
description = "Microchip AT86RF215 radio daemon"
authors = ["Oresat"]

[package.metadata.deb]
depends = "libc6 (>= 2.34), libgcc-s1 (>= 4.3)"
maintainer-scripts = "debian/"
systemd-units = [
    { unit-name = "uhf" },
]
assets = [
    ["target/release/uhf_daemon", "usr/bin/", "755"],
    ["configs/sat.toml", "etc/oresat/", "644"],
]
conf-files = ["/etc/oresat/sat.toml"]


[dependencies]
bitfield-struct = "0.13.0"
ciborium = "0.2"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
gpiocdev = "0.8.0"
mio = { version = "1.2.1", features = ["net", "os-poll", "os-ext"] }
paste = "1"
ratatui = { version = "0.30.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
signal-hook = "0.4.4"
spidev = "0.7.1"
timerfd = "1"
toml = "1.1.2"

[features]
tui = ["dep:ratatui", "dep:crossterm"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[[example]]
name = "tui"
required-features = ["tui"]

[[example]]
name = "uhf_tui"
required-features = ["tui"]


