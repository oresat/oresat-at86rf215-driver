# AT86RF215 daemon config - ground station side (alongside yamcs).
#
# Applied via `uhf_daemon --config configs/ground.toml`.
# Only fields that differ from the register default need to appear here
# (see src/config.rs)
# 
# Defaults already correct for this PHY (not set here): RXBWC.BW=0,
# RXDFE.RCUT=0, AGCC.AVGS=0, TXDFE.RCUT=0, TXCUTC.LPFCUT=0, FSKC0.MORD=0/BT=0,
# FSKC1.SRATE=0 (50 kHz).

# -- PHY type + baseband: PT=1 = MR-FSK (PT=0 is PHY OFF) ------------
[bbc0_pc]
pt = 1

# -- FSK modulation index: midx=1 * midxs=1 -> h=0.5 (MSK) ------------
[bbc0_fskc0]
midx = 1
midxs = 1

# -- Direct modulation (required for all FSK modes); pairs with txdfe.dm --------
[bbc0_fskdm]
en = true

# -- RX digital frontend (Table 6-51 SR + Table 6-60 sub-1GHz, mod index 1/2)
[rf09_rxdfe]
sr = 10        # fS = 400 kHz for 50 kHz symbols (reset 0 => 4 MHz = deaf)

[rf09_agcc]
en = true

[rf09_agcs]
tgt = 1

# -- TX digital frontend + filter (ground transmits TC uplink) -----------
[rf09_txdfe]
sr = 8         # fS = 500 kHz for 50 kHz symbols (v.3)
dm = true      # direct modulation (pairs with bbc0_fskdm.en)

[rf09_txcutc]
paramp = 3     # 32 us PA ramp

# -- Sub-1 GHz PA -------------------------------------
[rf09_pac]
txpwr = 5
pacur = 3

# -- External front-end (PA/LNA/switch) ------------------------------------
# padfe drives the FE control pins: 0 = disabled (external PA/LNA never keyed),
# 1 = FE_MODE_4, 2 = FE_MODE_5, 3 = FE_MODE_6. 
# The chip resets PADFE to 0, so an unset config leaves the FE off.
[rf09_padfe]
padfe = 2

# -- Daemon sockets (ground side) ------------------------------------------
# Not radio registers - daemon socket config, read by a second pass over this
# file. A matching CLI flag overrides any value here. 
# Defaults: 
# The beacon TX input binds 10015 (set enabled=false below to skip it),
# The RSSI push is off until a peer is set.
#
# [beacon]
# enabled = false
#
# [rssi]
# peer = "127.0.0.1:10030"
# interval_ms = 1000
